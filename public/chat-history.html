<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light Revealed - Live Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-main: #09090b; --bg-card: #18181b; --bg-input: #27272a; 
      --text-main: #fafafa; --text-muted: #a1a1aa; 
      --user-bubble: #2563eb; --guest-bubble: #f59e0b; --bot-bubble: #27272a; --border: #3f3f46;
    }
    * { box-sizing: border-box; font-family: "Inter", sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

    /* AUTH SCREEN */
    #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .auth-box { background: var(--bg-card); padding: 40px; border-radius: 12px; border: 1px solid var(--border); text-align: center; width: 90%; max-width: 350px; }
    .auth-box input { width: 100%; padding: 12px; margin: 15px 0; background: var(--bg-input); border: 1px solid var(--border); color: white; border-radius: 6px; text-align: center; letter-spacing: 2px; }
    .auth-box button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }

    /* HEADER */
    header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; gap: 20px; z-index: 10; }
    .search-container { display: flex; gap: 10px; flex: 1; max-width: 1000px; }
    .search-container input { flex: 1; padding: 10px 15px; background: var(--bg-input); border: 1px solid var(--border); color: white; border-radius: 20px; outline: none; }
    .search-container input:focus { border-color: #3b82f6; }
    
    .view-toggle { display: flex; background: var(--bg-input); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
    .view-toggle button { padding: 8px 18px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .view-toggle .active { background: #3b82f6; color: white; }
    .view-toggle .inactive { background: transparent; color: var(--text-muted); }

    .controls { display: flex; gap: 15px; align-items: center; font-size: 13px; color: var(--text-muted); flex-shrink: 0; }

    /* CHAT FEED */
    #chatFeed { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
    .message-wrapper { display: flex; flex-direction: column; max-width: 95%; width: 100%; margin: 0 auto; animation: fadeIn 0.3s ease; }
    .message-wrapper.user { align-items: flex-end; }
    .message-wrapper.model { align-items: flex-start; }
    
    .meta { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; display: flex; gap: 10px; align-items: center; }
    .msg-id { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-weight: 600; color: #fff; }
    
    .bubble { padding: 15px 20px; border-radius: 12px; position: relative; line-height: 1.5; font-size: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); word-wrap: break-word; max-width: 95%; }
    .users-view .user .bubble { background: var(--user-bubble); border-bottom-right-radius: 2px; }
    .guests-view .user .bubble { background: var(--guest-bubble); border-bottom-right-radius: 2px; color: #000; font-weight: 500; }
    .model .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

    .bubble p { margin-bottom: 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    .bubble th, .bubble td { border: 1px solid #555; padding: 6px; }

    .copy-btn { position: absolute; top: -10px; right: -10px; background: #3f3f46; border: 1px solid #52525b; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; opacity: 0; transition: all 0.2s; }
    .bubble:hover .copy-btn { opacity: 1; top: -15px; }
    .copy-btn:hover { background: #3b82f6; border-color: #3b82f6; transform: scale(1.1); }
    
    .load-more-btn { background: var(--bg-input); color: #3b82f6; border: 1px solid var(--border); padding: 10px 20px; border-radius: 20px; cursor: pointer; margin: 0 auto 20px auto; display: block; font-weight: 600; transition: 0.2s; }
    .load-more-btn:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* MOBILE OPTIMIZATION */
    @media (max-width: 768px) {
      header { flex-direction: column; align-items: stretch; padding: 15px; gap: 15px; }
      .search-container { flex-direction: column; max-width: 100%; }
      .view-toggle button { flex: 1; }
      .controls { justify-content: space-between; }
      #chatFeed { padding: 15px 10px; }
      .message-wrapper { max-width: 100%; }
      .bubble { max-width: 100%; padding: 12px; }
      .copy-btn { opacity: 1; top: -10px; right: 0; } /* Always show copy on mobile */
    }
  </style>
</head>
<body class="users-view">

  <div id="authScreen">
    <div class="auth-box">
      <h2>Live Monitor</h2>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">Enter Admin Password</p>
      <input type="password" id="adminPass" placeholder="••••••••" onkeypress="if(event.key === 'Enter') login()">
      <button onclick="login()" id="loginBtn">Connect</button>
      <p id="errorMsg" style="color: #ef4444; font-size: 12px; margin-top: 10px; display: none;">Invalid Password</p>
    </div>
  </div>

  <header>
    <div style="font-weight: 600; font-size: 16px;">
      Light Revealed <span style="color: #3b82f6; font-size: 12px; margin-left: 5px;">LIVE</span>
    </div>
    
    <div class="view-toggle">
      <button id="btn-users" class="active" onclick="switchFeed('users')">Users Feed</button>
      <button id="btn-guests" class="inactive" onclick="switchFeed('guests')">Guests Feed</button>
    </div>

    <div class="search-container">
      <input type="text" id="searchUser" placeholder="Search ID or Username..." onkeyup="debounceSearch()">
      <input type="text" id="searchText" placeholder="Search message content..." onkeyup="debounceSearch()">
    </div>

    <div class="controls">
      <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
        <input type="checkbox" id="liveToggle" checked onchange="toggleLiveSync()"> Auto-Sync
      </label>
      <button onclick="triggerSearch()" style="background: transparent; border: 1px solid var(--border); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Refresh</button>
    </div>
  </header>

  <div id="chatFeed"></div>

  <script>
    // ==========================================
    // ⚙️ CONFIGURATION
    // ==========================================
    const RENDER_URL = "https://light-revealed-engine.onrender.com";
    
    let adminToken = sessionStorage.getItem("monitorToken");
    let allChats = [];
    let syncInterval = null;
    let currentView = 'users';
    let hasMore = true;
    let isFetching = false;
    let searchTimeout = null;

    window.onload = () => {
      if (adminToken) {
        document.getElementById("authScreen").style.display = "none";
        startApp();
      }
    };

    async function login() {
      const pass = document.getElementById("adminPass").value;
      const btn = document.getElementById("loginBtn");
      btn.innerText = "Connecting...";
      
      try {
        const res = await fetch(`${RENDER_URL}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pass })
        });
        
        if (res.ok) {
          const data = await res.json();
          adminToken = data.token;
          sessionStorage.setItem("monitorToken", adminToken);
          document.getElementById("authScreen").style.display = "none";
          startApp();
        } else {
          document.getElementById("errorMsg").style.display = "block";
          btn.innerText = "Connect";
        }
      } catch (e) {
        document.getElementById("errorMsg").innerText = "Server offline or unreachable.";
        document.getElementById("errorMsg").style.display = "block";
        btn.innerText = "Connect";
      }
    }

    function startApp() {
      fetchChats(false);
      toggleLiveSync();
    }

    function switchFeed(type) {
      if (currentView === type) return;
      currentView = type;
      
      document.getElementById('btn-users').className = type === 'users' ? 'active' : 'inactive';
      document.getElementById('btn-guests').className = type === 'guests' ? 'active' : 'inactive';
      document.body.className = type === 'users' ? 'users-view' : 'guests-view';

      document.getElementById('searchUser').value = "";
      document.getElementById('searchText').value = "";
      triggerSearch();
    }

    function toggleLiveSync() {
      const isChecked = document.getElementById("liveToggle").checked;
      if (isChecked) {
        syncInterval = setInterval(() => fetchChats(false), 10000); 
      } else {
        clearInterval(syncInterval);
      }
    }

    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => triggerSearch(), 600); // 600ms delay to protect the database
    }

    function triggerSearch() {
      allChats = [];
      hasMore = true;
      document.getElementById("chatFeed").innerHTML = "<div style='text-align:center; color: #a1a1aa; margin-top: 20px;'>Loading database...</div>";
      fetchChats(false);
    }

    // The Engine: Handles both Loading Previous (Pagination) and Fetching Latest (Auto-Sync)
    async function fetchChats(isLoadMore = false) {
      if (isFetching) return;
      isFetching = true;

      try {
        const searchUser = document.getElementById("searchUser").value.trim();
        const searchText = document.getElementById("searchText").value.trim();
        
        let url = `${RENDER_URL}/api/admin/${currentView === 'users' ? 'live-chats' : 'live-guest-chats'}?1=1`;
        
        if (isLoadMore && allChats.length > 0) {
           url += `&before_id=${allChats[0].id}`;
        }
        if (searchUser) url += `&search_user=${encodeURIComponent(searchUser)}`;
        if (searchText) url += `&search_text=${encodeURIComponent(searchText)}`;

        const res = await fetch(url, { headers: { "x-admin-token": adminToken } });
        if (res.status === 401 || res.status === 403) {
           sessionStorage.removeItem("monitorToken");
           location.reload();
           return;
        }

        const newData = await res.json();
        const feed = document.getElementById("chatFeed");
        
        // Smart Scroll Detection (Discord-style): Are they currently reading the latest?
        const isNearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 150;
        
        if (isLoadMore) {
           if (newData.length < 20) hasMore = false;
           if (newData.length > 0) allChats = [...newData, ...allChats];
           renderChats(false); // Retain scroll position when prepending older messages
        } else {
           if (allChats.length === 0 || searchUser || searchText) {
               allChats = newData;
               hasMore = newData.length === 20;
               renderChats(true); // Jump to bottom on fresh load
           } else {
               // Auto-sync: Only inject messages newer than what we currently see
               const newestId = allChats[allChats.length - 1].id;
               const newMessages = newData.filter(c => c.id > newestId);
               if (newMessages.length > 0) {
                   allChats = [...allChats, ...newMessages];
                   renderChats(isNearBottom); // Only jump to bottom if they are actively reading the newest
               }
           }
        }
      } catch (e) { console.error("Sync failed:", e); } 
      finally { isFetching = false; }
    }

    function renderChats(scrollToBottom = false) {
      const feed = document.getElementById("chatFeed");
      const previousScrollHeight = feed.scrollHeight;
      const previousScrollTop = feed.scrollTop;

      feed.innerHTML = "";

      if (hasMore) {
         feed.innerHTML = `<button class="load-more-btn" onclick="fetchChats(true)">⬆ Load Previous Messages</button>`;
      }

      if (allChats.length === 0) {
         feed.innerHTML += `<div style='text-align:center; color: #a1a1aa; margin-top: 20px;'>No messages found.</div>`;
         return;
      }

      allChats.forEach(c => {
        const date = new Date(c.created_at).toLocaleString();
        const isUser = c.role === 'user';
        const displayName = c.username || `Guest_${c.session_id.substring(0,6)}`;
        const rawContent = c.content.replace(/"/g, '&quot;').replace(/'/g, "\\'");
        
        const wrapper = document.createElement("div");
        wrapper.className = `message-wrapper ${c.role}`;
        
        wrapper.innerHTML = `
          <div class="meta">
            ${isUser ? `<span class="msg-id">#${c.id}</span>` : ''}
            <span>${isUser ? `<strong>${displayName}</strong>` : 'Light Revealed'}</span>
            <span>•</span>
            <span>${date}</span>
            ${!isUser ? `<span class="msg-id">#${c.id}</span>` : ''}
          </div>
          <div class="bubble">
            <div class="copy-btn" onclick="copyText(this, '${rawContent}')" title="Copy Message">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </div>
            ${marked.parse(c.content)}
          </div>
        `;
        feed.appendChild(wrapper);
      });

      if (scrollToBottom) {
          feed.scrollTop = feed.scrollHeight;
      } else {
          // Seamless pagination: Keeps the screen exactly where it was before old messages were injected above
          feed.scrollTop = feed.scrollHeight - previousScrollHeight + previousScrollTop;
      }
    }

    function copyText(btnElement, text) {
      navigator.clipboard.writeText(text).then(() => {
        const originalIcon = btnElement.innerHTML;
        btnElement.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        setTimeout(() => { btnElement.innerHTML = originalIcon; }, 2000);
      });
    }
  </script>
</body>
</html>
