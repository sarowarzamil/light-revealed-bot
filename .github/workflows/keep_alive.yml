name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every single day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Current Time
        id: time
        run: echo "CURRENT_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Write Ping to Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CURRENT_TIME: ${{ env.CURRENT_TIME }}
        run: |
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -X POST "$SUPABASE_URL/rest/v1/ping_bot" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            --data-raw "{\"id\":1,\"message\":\"Engine active. Last pinged on: $CURRENT_TIME\"}"
